server:
  port: ${PORT:8081}

spring:
  application:
    name: kripibot-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.6-flash}
    base-url: https://generativelanguage.googleapis.com/v1beta
    default-system-prompt: "You are KripiBot, a brilliant, friendly, and helpful AI coding and general assistant. You provide accurate, concise, and structured answers formatted in markdown with code blocks where appropriate."
